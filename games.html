<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Games · Bjorn</title>
<meta name="description" content="A small library of browser games.">
<meta name="theme-color" content="#050508">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23050508'/><circle cx='16' cy='16' r='5' fill='%23b9c2ff'/><circle cx='16' cy='16' r='10' fill='%237c5cff' fill-opacity='.25'/></svg>">

<style>
/* ===== DESIGN TOKENS (same as index.html / share.html) ===== */
:root {
  --void: #050508;
  --ink: #f4f6ff;
  --ink-dim: #d9ddf5;
  --ink-faint: rgba(200, 205, 240, .55);
  --violet: 124, 92, 255;
  --cyan: 76, 201, 240;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--void); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
html.playing { overflow: hidden; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--font);
  color: var(--ink);
  background: var(--void);
  overflow-x: hidden;
}
body::before { /* faint nebula tint */
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(60% 50% at 18% 88%, rgba(var(--cyan), .055), transparent 70%),
    radial-gradient(55% 45% at 86% 14%, rgba(var(--violet), .08), transparent 70%);
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

.glass {
  background: rgba(16, 16, 30, .5);
  border: 1px solid rgba(255, 255, 255, .09);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: rgba(16, 16, 30, .88); }
}

.wrap {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 40px);
}

/* ===== TOP BAR ===== */
.bar {
  position: sticky;
  top: 0;
  z-index: 3;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 0 12px;
  background: linear-gradient(var(--void) 62%, rgba(5, 5, 8, 0));
}
.back {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 46px;
  padding: 0 16px 0 10px;
  border-radius: 999px;
  color: var(--ink-dim);
  font: 600 .9rem/1 var(--font);
  text-decoration: none;
  touch-action: manipulation;
  transition: transform .25s ease, border-color .25s ease, color .25s ease, box-shadow .25s ease;
}
.back svg, .search svg, .ibtn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.search { position: relative; flex: 1; min-width: 0; }
.search > svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; margin-top: -9px; color: var(--ink-faint); pointer-events: none; }
.search input {
  width: 100%;
  min-height: 46px;
  padding: 0 44px 0 42px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, .1);
  background: rgba(16, 16, 30, .6);
  color: var(--ink);
  font: 500 1rem/1 var(--font); /* 16px stops mobile zoom-on-focus */
  transition: border-color .25s, box-shadow .25s;
  -webkit-appearance: none;
  appearance: none;
}
.search input::-webkit-search-cancel-button { display: none; }
.search input::placeholder { color: rgba(200, 205, 240, .35); }
.search input:focus { outline: none; border-color: rgba(var(--cyan), .6); box-shadow: 0 0 0 3px rgba(var(--cyan), .14); }
.clear {
  position: absolute;
  right: 4px;
  top: 50%;
  width: 38px;
  height: 38px;
  margin-top: -19px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-faint);
  cursor: pointer;
  touch-action: manipulation;
}
.clear[hidden] { display: none; }
.clear svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

@media (hover: hover) {
  .back:hover { transform: translateY(-2px); border-color: rgba(var(--violet), .55); color: #fff; box-shadow: 0 8px 30px -8px rgba(var(--violet), .55); }
  .clear:hover { color: #fff; }
}
.back:active { transform: scale(.97); }
.back:focus-visible, .card:focus-visible, .ibtn:focus-visible, .clear:focus-visible { outline: 2px solid rgb(127, 220, 255); outline-offset: 3px; }

/* ===== HERO ===== */
.hero { text-align: center; padding: 12px 0 22px; }
h1 {
  margin: 0;
  padding-left: .12em;
  font-size: clamp(2.2rem, 10vw, 3rem);
  font-weight: 300;
  line-height: 1.1;
  letter-spacing: .12em;
  text-shadow: 0 0 18px rgba(150, 130, 255, .55), 0 0 60px rgba(100, 120, 255, .35), 0 0 120px rgba(var(--cyan), .2);
  animation: emerge 1.8s cubic-bezier(.2, .7, .2, 1) backwards;
}
.count { margin: 10px 0 0; color: var(--ink-faint); font-size: .9rem; }

/* ===== GRID + CARDS ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr));
  gap: 12px;
  animation: rise 1s cubic-bezier(.2, .7, .2, 1) .4s backwards;
}
.card {
  display: flex;
  flex-direction: column;
  padding: 0;
  overflow: hidden;
  border-radius: 20px;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .28s cubic-bezier(.2, .7, .2, 1), border-color .28s ease, box-shadow .28s ease;
}
.card[hidden] { display: none; }
.thumb {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 16 / 10;
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 15% 0%, hsla(var(--h1), 90%, 62%, .5), transparent 60%),
    radial-gradient(100% 90% at 100% 100%, hsla(var(--h2), 90%, 60%, .45), transparent 60%),
    #0b0b16;
}
.thumb::after { /* tiny star specks */
  content: "";
  position: absolute;
  inset: 0;
  opacity: .5;
  background:
    radial-gradient(1px 1px at 18% 30%, #fff, transparent),
    radial-gradient(1px 1px at 72% 22%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 84% 68%, #fff, transparent),
    radial-gradient(1px 1px at 30% 78%, #fff, transparent),
    radial-gradient(1px 1px at 55% 55%, #fff, transparent);
}
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.ico { position: relative; z-index: 1; font-size: clamp(2.2rem, 11vw, 3rem); line-height: 1; filter: drop-shadow(0 0 14px rgba(255, 255, 255, .35)); transition: transform .35s cubic-bezier(.2, .7, .2, 1); }
.info { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px 14px; }
.name { font-size: .98rem; font-weight: 600; letter-spacing: .01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  padding: 3px 9px;
  border-radius: 999px;
  border: 1px solid rgba(var(--violet), .35);
  background: rgba(var(--violet), .1);
  color: var(--ink-dim);
  font-size: .72rem;
  font-weight: 500;
}
@media (hover: hover) {
  .card:hover { transform: translateY(-4px); border-color: rgba(var(--violet), .55); box-shadow: 0 14px 40px -12px rgba(var(--violet), .6); }
  .card:hover .ico { transform: scale(1.12) rotate(-3deg); }
}
.card:active { transform: scale(.97); }

.empty { grid-column: 1 / -1; padding: 40px 12px; text-align: center; color: var(--ink-faint); line-height: 1.6; }
.empty[hidden] { display: none; }

/* ===== PLAYER (theater mode) ===== */
.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(3, 3, 6, .84);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  animation: fade .2s ease;
}
.overlay[hidden] { display: none; }
.panel {
  display: flex;
  flex-direction: column;
  width: min(100%, 1200px);
  height: min(100%, 780px);
  overflow: hidden;
  border-radius: 20px;
  background: rgba(10, 10, 20, .94);
  box-shadow: 0 30px 90px -20px rgba(var(--violet), .45);
  animation: pop .28s cubic-bezier(.2, .7, .2, 1);
}
.panel:focus { outline: none; }
.panel:fullscreen { width: 100%; height: 100%; max-width: none; border-radius: 0; }
.panel:-webkit-full-screen { width: 100%; height: 100%; max-width: none; border-radius: 0; }
.overlay.max { padding: 0; }
.overlay.max .panel { width: 100%; height: 100%; border-radius: 0; }

.pbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 52px;
  padding: 6px 8px 6px 16px;
  border-bottom: 1px solid rgba(255, 255, 255, .08);
}
.ptitle { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ptitle b { font-size: .98rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptitle small { color: var(--ink-faint); font-size: .74rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ibtn {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  padding: 0 12px;
  border: 1px solid rgba(255, 255, 255, .09);
  border-radius: 12px;
  background: rgba(255, 255, 255, .05);
  color: var(--ink-dim);
  font: 600 .85rem/1 var(--font);
  text-decoration: none;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .2s ease, border-color .25s ease, background .25s ease, color .25s ease;
}
.ibtn:active { transform: scale(.94); }
@media (hover: hover) { .ibtn:hover { border-color: rgba(var(--violet), .55); color: #fff; background: rgba(var(--violet), .14); } }
@media (max-width: 520px) { .ibtn .lbl { display: none; } .ibtn { padding: 0; } }

.stage { position: relative; flex: 1; min-height: 0; background: #000; }
.stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; z-index: 1; }
.loading {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  padding: 24px;
  text-align: center;
  color: var(--ink-faint);
  font-size: .9rem;
  line-height: 1.5;
}
.loading.done { display: none; }
.loading i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(var(--violet), .25); border-top-color: rgb(var(--cyan)); animation: spin .8s linear infinite; }

@media (max-width: 640px) {
  .overlay { padding: 0; }
  .panel { width: 100%; height: 100%; border-radius: 0; }
}

/* ===== MOTION ===== */
@keyframes emerge { from { opacity: 0; filter: blur(14px); transform: scale(1.06); } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(8px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) {
  h1, .grid, .overlay, .panel, .loading i { animation: none; }
  .card, .ico, .back, .ibtn { transition: none; }
}
@media (max-width: 380px) { .back { padding: 0 12px 0 8px; } .wrap { padding-left: 12px; padding-right: 12px; } }
</style>
</head>

<body>
<canvas id="bg" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="bar">
    <a class="back glass" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      Back to Orbit
    </a>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button class="clear" id="clear" type="button" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
  </header>

  <section class="hero">
    <h1>Games</h1>
    <p class="count" id="count" role="status" aria-live="polite"></p>
  </section>

  <main class="grid" id="grid">
    <p class="empty" id="empty" hidden></p>
  </main>
</div>

<!-- THEATER-MODE PLAYER -->
<div class="overlay" id="overlay" hidden>
  <div class="panel glass" id="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" tabindex="-1">
    <header class="pbar">
      <div class="ptitle"><b id="p-title"></b><small id="p-by"></small></div>
      <a class="ibtn" id="p-new" target="_blank" rel="noopener noreferrer" aria-label="Open in new tab" title="Open in new tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6m0-6-9 9M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></svg>
      </a>
      <button class="ibtn" id="p-fs" type="button" aria-label="Toggle fullscreen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <span class="lbl" id="p-fs-lbl">Fullscreen</span>
      </button>
      <button class="ibtn" id="p-close" type="button" aria-label="Close game">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="stage" id="stage">
      <div class="loading" id="loading"><i></i><span id="load-msg">Loading</span></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     GAME CATALOG: add or remove games here.
     id     : short unique slug (also used for links like /games#2048)
     url    : the page that gets loaded inside the player (must be https)
     icon   : emoji shown on the card (or add img: '/games/thumbs/name.png')
     hue    : two colours (0-360) for the card's gradient
     Only add games you have the right to embed. Open-source and
     author-hosted games are the safest choice.
     ===================================================================== */
  var GAMES = [
    { id: '2048', title: '2048', by: 'Gabriele Cirulli', tags: ['Puzzle'],
      url: 'https://gabrielecirulli.github.io/2048/', icon: '🔢', hue: [38, 18] },
    { id: 'hextris', title: 'Hextris', by: 'Logan Engstrom and friends', tags: ['Puzzle', 'Arcade'],
      url: 'https://hextris.github.io/hextris/', icon: '🔷', hue: [190, 270] },
    { id: 'hexgl', title: 'HexGL', by: 'Thibaut Despoulain', tags: ['Racing', '3D'],
      url: 'https://hexgl.bkcore.com/', icon: '🏎️', hue: [200, 305] },
    { id: 'clumsy-bird', title: 'Clumsy Bird', by: 'Ellison Leão', tags: ['Arcade'],
      url: 'https://ellisonleao.github.io/clumsy-bird/', icon: '🐦', hue: [48, 165] },
    { id: 'a-dark-room', title: 'A Dark Room', by: 'Doublespeak Games', tags: ['Text', 'Adventure'],
      url: 'https://adarkroom.doublespeakgames.com/', icon: '🔥', hue: [18, 350] },
    { id: 'elevator-saga', title: 'Elevator Saga', by: 'magwo', tags: ['Coding', 'Puzzle'],
      url: 'https://play.elevatorsaga.com/', icon: '🏢', hue: [262, 200] },
    { id: '0hh1', title: '0h h1', by: 'Q42', tags: ['Puzzle', 'Logic'],
      url: 'https://0hh1.com/', icon: '🧩', hue: [350, 215] },
    { id: 'cubiks-2048', title: 'Cubiks 2048', by: 'Kshitij Banerjee', tags: ['Puzzle', '3D'],
      url: 'https://kshitij-banerjee.github.io/Cubiks-2048/', icon: '🧊', hue: [172, 232] }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var el = {
    grid: $('grid'), empty: $('empty'), count: $('count'), q: $('q'), clear: $('clear'),
    overlay: $('overlay'), panel: $('panel'), stage: $('stage'), loading: $('loading'), msg: $('load-msg'),
    title: $('p-title'), by: $('p-by'), nt: $('p-new'), fs: $('p-fs'), fsl: $('p-fs-lbl'), close: $('p-close')
  };

  var current = null, opener = null, slowT = null, paused = false;

  /* ===== CARDS ===== */
  GAMES.forEach(function (g) {
    g.search = (g.title + ' ' + g.tags.join(' ') + ' ' + (g.by || '')).toLowerCase();
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'card glass';
    b.style.setProperty('--h1', g.hue[0]);
    b.style.setProperty('--h2', g.hue[1]);
    b.innerHTML = '<span class="thumb"><span class="ico"></span></span><span class="info"><span class="name"></span><span class="tags"></span></span>';
    b.querySelector('.ico').textContent = g.icon;
    b.querySelector('.name').textContent = g.title;
    var tg = b.querySelector('.tags');
    g.tags.forEach(function (t) {
      var s = document.createElement('span');
      s.className = 'tag'; s.textContent = t;
      tg.appendChild(s);
    });
    if (g.img) {
      var im = document.createElement('img');
      im.alt = ''; im.loading = 'lazy'; im.decoding = 'async'; im.src = g.img;
      im.onerror = function () { im.remove(); };
      b.querySelector('.thumb').appendChild(im);
    }
    b.setAttribute('aria-label', 'Play ' + g.title);
    b.addEventListener('click', function () { open(g, true); });
    g.node = b;
    el.grid.insertBefore(b, el.empty);
  });

  /* ===== SEARCH ===== */
  function filter() {
    var raw = el.q.value.trim().toLowerCase();
    var terms = raw ? raw.split(/\s+/) : [];
    var shown = 0;
    GAMES.forEach(function (g) {
      var hit = terms.every(function (t) { return g.search.indexOf(t) > -1; });
      g.node.hidden = !hit;
      if (hit) shown++;
    });
    el.clear.hidden = !el.q.value;
    el.count.textContent = raw
      ? shown + ' of ' + GAMES.length + ' games'
      : GAMES.length + ' games. Tap one to play.';
    el.empty.hidden = shown > 0;
    if (!shown) el.empty.textContent = 'No games match “' + el.q.value.trim().slice(0, 40) + '”. Try another name or tag.';
  }
  el.q.addEventListener('input', filter);
  el.clear.addEventListener('click', function () { el.q.value = ''; filter(); el.q.focus(); });
  window.addEventListener('keydown', function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || '';
    if (e.key === '/' && !current && tag !== 'INPUT' && tag !== 'TEXTAREA') { e.preventDefault(); el.q.focus(); }
  });
  filter();

  /* ===== PLAYER ===== */
  function isFS() { return document.fullscreenElement || document.webkitFullscreenElement; }

  function syncFS() {
    var on = !!isFS() || el.overlay.classList.contains('max');
    el.fsl.textContent = on ? 'Exit' : 'Fullscreen';
  }

  function toggleFS() {
    if (isFS()) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      return;
    }
    if (el.overlay.classList.contains('max')) { el.overlay.classList.remove('max'); syncFS(); return; }
    var req = el.panel.requestFullscreen || el.panel.webkitRequestFullscreen;
    var fallback = function () { el.overlay.classList.add('max'); syncFS(); }; // browsers without element fullscreen
    if (!req) { fallback(); return; }
    try { Promise.resolve(req.call(el.panel)).catch(fallback); } catch (e) { fallback(); }
  }
  document.addEventListener('fullscreenchange', syncFS);
  document.addEventListener('webkitfullscreenchange', syncFS);

  function open(g, push) {
    if (current) kill();
    current = g;
    opener = document.activeElement;
    el.title.textContent = g.title;
    el.by.textContent = g.by ? 'by ' + g.by : '';
    el.nt.href = g.url;
    el.msg.textContent = 'Loading ' + g.title;
    el.loading.classList.remove('done');
    el.overlay.classList.remove('max');
    el.overlay.hidden = false;
    document.documentElement.classList.add('playing');
    paused = true; // stop the background starfield while a game runs
    syncFS();

    var f = document.createElement('iframe');
    f.title = g.title;
    f.setAttribute('allow', 'autoplay; fullscreen; gamepad');
    f.setAttribute('allowfullscreen', '');
    f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-pointer-lock allow-forms allow-modals');
    f.referrerPolicy = 'no-referrer';
    f.addEventListener('load', function () {
      clearTimeout(slowT);
      el.loading.classList.add('done');
    });
    f.src = g.url;
    el.stage.appendChild(f);

    clearTimeout(slowT);
    slowT = setTimeout(function () {
      el.msg.textContent = 'Still loading. If nothing appears, this game may not allow embedding. Try “Open in new tab” at the top.';
    }, 9000);

    // Focus the dialog (not the game) so Esc works right away; tapping the game hands it the keyboard.
    el.panel.focus();
    if (push) history.pushState({ game: g.id }, '', '#' + g.id);
  }

  // Destroying the iframe is what actually stops the game's audio and network.
  function kill() {
    clearTimeout(slowT);
    var f = el.stage.querySelector('iframe');
    if (f) { f.src = 'about:blank'; f.remove(); }
  }

  function cleanup() {
    if (!current) return;
    if (isFS()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
    kill();
    el.overlay.hidden = true;
    el.overlay.classList.remove('max');
    document.documentElement.classList.remove('playing');
    current = null;
    paused = false;
    if (opener && opener.focus) { try { opener.focus(); } catch (e) {} }
  }

  // Closing via the button, Esc or a backdrop tap steps back through history,
  // which keeps the phone's back gesture and the Close button in sync.
  function requestClose() {
    if (!current) return;
    if (history.state && history.state.game) history.back();
    else cleanup();
  }

  el.close.addEventListener('click', requestClose);
  el.fs.addEventListener('click', toggleFS);
  el.overlay.addEventListener('pointerdown', function (e) { if (e.target === el.overlay) requestClose(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && current && !isFS()) requestClose();
  });

  function fromHash() {
    var id = decodeURIComponent(location.hash.slice(1));
    return GAMES.filter(function (g) { return g.id === id; })[0] || null;
  }
  window.addEventListener('popstate', function () {
    if (current) cleanup();
    else { var g = fromHash(); if (g) open(g, false); }
  });
  window.addEventListener('pagehide', kill);

  // Deep link: /games#hextris opens that game directly
  var linked = fromHash();
  if (linked) {
    history.replaceState(null, '', location.pathname + location.search);
    open(linked, true);
  }

  /* ===== STARFIELD BACKDROP (light, non-interactive) ===== */
  (function () {
    var c = $('bg'), x = c.getContext('2d'), W = 0, H = 0, stars = [], last = 0;
    function size() {
      var d = Math.min(window.devicePixelRatio || 1, 1.5);
      W = window.innerWidth; H = window.innerHeight;
      c.width = W * d; c.height = H * d;
      x.setTransform(d, 0, 0, d, 0, 0);
      var n = Math.min(520, Math.round(W * H / 2800));
      stars = [];
      for (var i = 0; i < n; i++) stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: .4 + Math.pow(Math.random(), 3) * 1.4, a: .3 + Math.random() * .6,
        s: .5 + Math.random() * 1.5, p: Math.random() * 6.28, v: 2 + Math.random() * 6
      });
      draw(0, 0);
    }
    function draw(t, dt) {
      x.clearRect(0, 0, W, H);
      x.fillStyle = '#dfe4ff';
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        x.globalAlpha = s.a * (reduce ? 1 : .7 + .3 * Math.sin(t / 1000 * s.s + s.p));
        x.fillRect(s.x, s.y, s.r * 2, s.r * 2);
        if (!reduce) { s.y -= s.v * dt; if (s.y < -2) { s.y = H + 2; s.x = Math.random() * W; } }
      }
    }
    function loop(t) {
      requestAnimationFrame(loop);
      if (paused || t - last < 33) return;
      var dt = Math.min((t - last) / 1000, .1);
      last = t;
      draw(t, dt);
    }
    window.addEventListener('resize', function () {
      if (window.innerWidth !== W || Math.abs(window.innerHeight - H) > 150) size();
    });
    size();
    if (!reduce) requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
