<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bjorn</title>
<meta name="description" content="Bjorn's corner of the internet.">
<meta name="theme-color" content="#050508">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Bjorn">
<meta property="og:description" content="Bjorn's corner of the internet.">
<meta property="og:url" content="https://bjornon.top">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23050508'/><circle cx='16' cy='16' r='5' fill='%23b9c2ff'/><circle cx='16' cy='16' r='10' fill='%237c5cff' fill-opacity='.25'/></svg>">

<style>
/* ===== DESIGN TOKENS (edit these to retheme) ===== */
:root {
  --void: #050508;
  --ink: #f4f6ff;
  --ink-dim: #d9ddf5;
  --ink-faint: rgba(200, 205, 240, .38);
  --violet: 124, 92, 255;
  --cyan: 76, 201, 240;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* ===== BASE ===== */
*, *::before, *::after { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--void);
  overscroll-behavior: none;
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font);
  color: var(--ink);
  /* Very faint nebula tint behind the canvas; the base stays void black */
  background:
    radial-gradient(60% 50% at 18% 88%, rgba(var(--cyan), .055), transparent 70%),
    radial-gradient(55% 45% at 86% 14%, rgba(var(--violet), .08), transparent 70%),
    var(--void);
}

#sky {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}
html.grabbing #sky { cursor: grabbing; }

/* ===== NAME ===== */
.stage {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  pointer-events: none;
  user-select: none;
  -webkit-user-select: none;
}
.stage > .halo, .stage > .name { grid-area: 1 / 1; }

.halo {
  width: clamp(280px, 70vw, 720px);
  aspect-ratio: 2 / 1;
  background: radial-gradient(closest-side, rgba(var(--violet), .26), rgba(var(--cyan), .06) 60%, transparent 100%);
  filter: blur(18px);
  animation: breathe 7s ease-in-out infinite;
}

.name {
  margin: 0;
  padding-left: .16em; /* balances the trailing letter-spacing so the word is truly centered */
  font-size: clamp(3.75rem, 17vw, 9.5rem);
  font-weight: 300;
  line-height: 1;
  letter-spacing: .16em;
  color: var(--ink);
  text-shadow:
    0 0 18px rgba(150, 130, 255, .55),
    0 0 60px rgba(100, 120, 255, .35),
    0 0 120px rgba(var(--cyan), .2);
  animation: emerge 2.4s cubic-bezier(.2, .7, .2, 1) backwards;
}

.hint {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(50% + clamp(2.8rem, 10.5vw, 6rem));
  text-align: center;
  font-size: .8rem;
  letter-spacing: .04em;
  color: var(--ink-faint);
  transition: opacity 1.2s ease;
  animation: fade 1.4s ease 2.6s backwards;
}
.hint.is-hidden { opacity: 0; }

/* ===== DOCK ===== */
.dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  z-index: 2;
  display: flex;
  flex-wrap: nowrap;
  justify-content: center;
  gap: .6rem;
  padding: 0 .75rem;
  animation: rise 1.2s cubic-bezier(.2, .7, .2, 1) 1.5s backwards;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: .6rem;
  min-height: 44px;
  padding: 0 1.05rem;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, .09);
  background: rgba(16, 16, 30, .5);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
  color: var(--ink-dim);
  font: 500 .9rem/1 var(--font);
  letter-spacing: .01em;
  text-decoration: none;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .25s ease, border-color .25s ease, background .25s ease,
              color .25s ease, box-shadow .25s ease;
}
.pill svg {
  width: 18px;
  height: 18px;
  flex: none;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.pill svg.fill { fill: currentColor; stroke: none; }

@media (hover: hover) {
  .pill:hover {
    transform: translateY(-2px);
    border-color: rgba(var(--violet), .5);
    background: rgba(28, 26, 56, .62);
    color: #fff;
    box-shadow: 0 8px 30px -8px rgba(var(--violet), .55);
  }
}
.pill:active { transform: scale(.97); }
.pill:focus-visible { outline: 2px solid rgb(127, 220, 255); outline-offset: 3px; }

@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .pill { background: rgba(16, 16, 30, .85); }
}

/* ===== MOTION ===== */
@keyframes emerge {
  from { opacity: 0; filter: blur(14px); transform: scale(1.06); }
}
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes breathe {
  0%, 100% { opacity: .7; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.06); }
}

@media (prefers-reduced-motion: reduce) {
  .halo, .name, .hint, .dock { animation: none; }
  .pill { transition: none; }
}

@media (max-width: 420px) {
  .dock { gap: .5rem; }
  .pill { padding: 0 .9rem; font-size: .85rem; }
}
</style>
</head>

<body>
<canvas id="sky" aria-hidden="true"></canvas>

<!-- ===== CONTENT: edit the name here ===== -->
<main class="stage">
  <div class="halo" aria-hidden="true"></div>
  <h1 class="name">Bjorn</h1>
  <p class="hint" id="hint">Drag to turn the sky</p>
</main>

<!-- ===== DOCK: edit links here ===== -->
<nav class="dock" aria-label="Links">
  <a class="pill" href="/share">

    <span>File drop</span>
  </a>

  <a class="pill" href="https://github.com/bjornxty" target="_blank" rel="noopener noreferrer">

    <span>GitHub</span>
  </a>
</nav>

<script>
(function () {
  'use strict';

  /* ===== SETTINGS (safe to tweak) ===== */
  var CONFIG = {
    density: 350,        // lower = more stars (pixels per star)
    minStars: 600,
    maxStars: 2400,
    sensitivity: 0.0042, // drag strength (radians per pixel)
    idleSpin: 0.025,     // slow drift when untouched (radians per second)
    friction: 1.6,       // how quickly the spin settles after release
    parallax: 16         // mouse-hover shift in pixels (desktop only)
  };
  var COLORS = ['rgb(232,236,255)', 'rgb(176,196,255)', 'rgb(196,170,255)', 'rgb(150,224,255)', 'rgb(255,226,190)'];

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, dpr = 1, S = 0, cx = 0, cy = 0;
  var n = 0, nx, ny, nz, sz, alpha, tws, twp, ci, lx, ly;

  var yaw = 0, pitch = 0, velYaw = 0, velPitch = 0;
  var dragging = false, pid = null, lastX = 0, lastY = 0, accX = 0, accY = 0;
  var gx = 0, gy = 0, glowA = 0;
  var tx = 0, ty = 0, offX = 0, offY = 0;

  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

  /* ===== STAR FIELD ===== */
  function build(count) {
    var list = [], i, r, c;
    for (i = 0; i < count; i++) {
      // Uniform point inside a unit ball
      var u = Math.random() * 2 - 1;
      var t = Math.random() * Math.PI * 2;
      var rad = Math.cbrt(Math.random());
      var s = Math.sqrt(1 - u * u);
      r = Math.random();
      c = r < .55 ? 0 : r < .75 ? 1 : r < .88 ? 2 : r < .96 ? 3 : 4;
      list.push({
        x: s * Math.cos(t) * rad, y: s * Math.sin(t) * rad, z: u * rad,
        size: .5 + Math.pow(Math.random(), 3) * 1.9,
        a: .35 + Math.random() * .65,
        ts: .6 + Math.random() * 1.8,
        tp: Math.random() * 6.283,
        c: c
      });
    }
    list.sort(function (a, b) { return a.c - b.c; }); // group by colour = fewer style changes
    n = count;
    nx = new Float32Array(n); ny = new Float32Array(n); nz = new Float32Array(n);
    sz = new Float32Array(n); alpha = new Float32Array(n);
    tws = new Float32Array(n); twp = new Float32Array(n);
    ci = new Uint8Array(n); lx = new Float32Array(n); ly = new Float32Array(n);
    for (i = 0; i < n; i++) {
      var o = list[i];
      nx[i] = o.x; ny[i] = o.y; nz[i] = o.z; sz[i] = o.size; alpha[i] = o.a;
      tws[i] = o.ts; twp[i] = o.tp; ci[i] = o.c; lx[i] = NaN; ly[i] = NaN;
    }
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round';
    S = Math.max(W, H) * .85;
    cx = W / 2; cy = H / 2;
    var want = clamp(Math.round(W * H / CONFIG.density), CONFIG.minStars, CONFIG.maxStars);
    if (!n || Math.abs(want - n) / n > .3) build(want);
  }

  /* ===== INPUT (mouse, touch and pen via pointer events) ===== */
  var hint = document.getElementById('hint');
  var hintHidden = false;
  function hideHint() {
    if (hintHidden) return;
    hintHidden = true;
    hint.classList.add('is-hidden');
  }

  window.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('.dock')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragging = true; pid = e.pointerId;
    lastX = gx = e.clientX; lastY = gy = e.clientY;
    accX = accY = 0;
    hideHint();
    document.documentElement.classList.add('grabbing');
  });

  window.addEventListener('pointermove', function (e) {
    if (dragging && e.pointerId === pid) {
      accX += e.clientX - lastX; accY += e.clientY - lastY;
      lastX = gx = e.clientX; lastY = gy = e.clientY;
    } else if (!dragging && e.pointerType === 'mouse' && !reduceMotion) {
      tx = -(e.clientX / W - .5) * CONFIG.parallax * 2;
      ty = -(e.clientY / H - .5) * CONFIG.parallax * 2;
    }
  });

  function release(e) {
    if (dragging && e.pointerId === pid) {
      dragging = false; pid = null;
      document.documentElement.classList.remove('grabbing');
    }
  }
  window.addEventListener('pointerup', release);
  window.addEventListener('pointercancel', release);
  window.addEventListener('blur', function () {
    dragging = false;
    document.documentElement.classList.remove('grabbing');
  });

  /* ===== SIMULATION + RENDER ===== */
  var last = performance.now();

  function frame(now) {
    var dt = clamp((now - last) / 1000, .001, .05);
    last = now;

    var idle = reduceMotion ? 0 : CONFIG.idleSpin;
    if (dragging) {
      var dyaw = accX * CONFIG.sensitivity, dpitch = accY * CONFIG.sensitivity;
      accX = accY = 0;
      yaw += dyaw; pitch += dpitch;
      var f = 1 - Math.exp(-dt * 18);
      velYaw += (clamp(dyaw / dt, -12, 12) - velYaw) * f;
      velPitch += (clamp(dpitch / dt, -12, 12) - velPitch) * f;
      glowA += (1 - glowA) * (1 - Math.exp(-dt * 10));
    } else {
      yaw += velYaw * dt; pitch += velPitch * dt;
      velYaw += (idle - velYaw) * (1 - Math.exp(-dt * CONFIG.friction));
      velPitch *= Math.exp(-dt * 2.4);
      pitch -= pitch * (1 - Math.exp(-dt * .12));
      glowA *= Math.exp(-dt * 5);
    }
    pitch = clamp(pitch, -1.35, 1.35);

    var p = 1 - Math.exp(-dt * 4);
    offX += (tx - offX) * p; offY += (ty - offY) * p;

    draw(now / 1000);
    requestAnimationFrame(frame);
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);

    var cyw = Math.cos(yaw), syw = Math.sin(yaw);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var ox = cx + offX, oy = cy + offY;
    var lastC = -1;

    for (var i = 0; i < n; i++) {
      var x = nx[i], y = ny[i], z = nz[i];
      var x1 = x * cyw - z * syw;
      var z1 = x * syw + z * cyw;
      var y2 = y * cp - z1 * sp;
      var z2 = y * sp + z1 * cp;

      var k = 2 / (2 + z2);              // perspective: 0.67 (far) to 2 (near)
      var px = ox + x1 * S * k;
      var py = oy + y2 * S * k;

      var qx = lx[i], qy = ly[i];
      if (qx !== qx) { qx = px; qy = py; } // NaN on first frame
      lx[i] = px; ly[i] = py;

      if (px < -24 || px > W + 24 || py < -24 || py > H + 24) continue;

      var depth = (k - .667) / 1.333;      // 0..1
      var a = alpha[i] * (.3 + .7 * depth);
      if (!reduceMotion) a *= .72 + .28 * Math.sin(t * tws[i] + twp[i]);
      var r = sz[i] * (.55 + .75 * depth);

      if (ci[i] !== lastC) {
        lastC = ci[i];
        ctx.fillStyle = ctx.strokeStyle = COLORS[lastC];
      }
      ctx.globalAlpha = a;

      var dx = px - qx, dy = py - qy, d2 = dx * dx + dy * dy;
      if (d2 > 6 && d2 < 40000) {          // moving fast: draw a streak
        ctx.lineWidth = Math.max(r * 1.5, .8);
        ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(px, py); ctx.stroke();
      } else if (r < 1.1) {
        ctx.fillRect(px - r, py - r, r * 2, r * 2);
      } else {
        ctx.beginPath(); ctx.arc(px, py, r, 0, 6.2832); ctx.fill();
        if (r > 1.8) {
          ctx.globalAlpha = a * .14;
          ctx.beginPath(); ctx.arc(px, py, r * 3.2, 0, 6.2832); ctx.fill();
        }
      }
    }

    ctx.globalAlpha = 1;
    if (glowA > .01) {
      var g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 150);
      g.addColorStop(0, 'rgba(150,130,255,' + (.22 * glowA).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(150,130,255,0)');
      ctx.fillStyle = g;
      ctx.fillRect(gx - 150, gy - 150, 300, 300);
    }
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
