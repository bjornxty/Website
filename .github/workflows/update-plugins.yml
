name: Generate Plugin Hashes

on:
  workflow_dispatch:

jobs:
  hash:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Calculate Hashes and Update JSON
        run: |
          node -e '
          const fs = require("fs");
          const crypto = require("crypto");
          const https = require("https");

          async function fetchBuffer(url) {
            return new Promise((resolve, reject) => {
              https.get(url, (res) => {
                if (res.statusCode >= 300 && res.statusCode < 400 && res.headers.location) {
                  return fetchBuffer(res.headers.location).then(resolve).catch(reject);
                }
                const data = [];
                res.on("data", chunk => data.push(chunk));
                res.on("end", () => resolve(Buffer.concat(data)));
              }).on("error", reject);
            });
          }

          async function run() {
            const file = "plugins/index.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            for (const key of Object.keys(manifest.plugins)) {
              const p = manifest.plugins[key];
              const latestVer = p.channels.latest;
              const vObj = p.versions[latestVer];
              let targetUrl = vObj.url;
              if (targetUrl.endsWith("/")) targetUrl += "index.js";
              console.log("Checking:", p.name, targetUrl);
              try {
                const buf = await fetchBuffer(targetUrl);
                vObj.size = buf.length;
                vObj.sha256 = crypto.createHash("sha256").update(buf).digest("hex");
              } catch(e) {
                console.error("Failed for", p.name, e);
              }
            }
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2));
          }
          run();
          '

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/index.json
          git commit -m "Auto-update exact plugin hashes and sizes" || exit 0
          git push
