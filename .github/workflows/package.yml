name: Build and Package Plugins

on:
  workflow_dispatch:
  push:
    paths:
      - 'build.js'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Plugins and Update Manifest
        run: |
          npm install archiver
          node build.js

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/
          git commit -m "Auto-package Valenced plugin zips and manifest" || exit 0
          git push
