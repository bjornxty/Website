<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>404 · Lost in deep space</title>
<meta name="description" content="This page doesn’t exist.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050508">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23050508'/><circle cx='16' cy='16' r='5' fill='%23b9c2ff'/><circle cx='16' cy='16' r='10' fill='%237c5cff' fill-opacity='.25'/></svg>">

<style>
/* ===== DESIGN TOKENS (same as index.html) ===== */
:root {
  --void: #050508;
  --ink: #f4f6ff;
  --ink-dim: #d9ddf5;
  --ink-faint: rgba(200, 205, 240, .55);
  --violet: 124, 92, 255;
  --cyan: 76, 201, 240;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--void);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
body {
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(60% 50% at 18% 88%, rgba(var(--cyan), .055), transparent 70%),
    radial-gradient(55% 45% at 86% 14%, rgba(var(--violet), .08), transparent 70%),
    var(--void);
}

/* ===== STREAM CANVAS ===== */
#stream {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  pointer-events: none;
  transform: translateZ(0); /* own GPU layer */
}

/* ===== CONTENT ===== */
.stage {
  position: fixed;
  inset: 0;
  display: flex;
  overflow-x: hidden;
  overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) 20px calc(env(safe-area-inset-bottom, 0px) + 20px);
}
.content {
  position: relative;
  z-index: 1;
  margin: auto; /* centers when it fits, scrolls safely when it doesn't */
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.content::before { /* dark veil so the 404 stays legible over the stream */
  content: "";
  position: absolute;
  inset: -22% -34%;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(closest-side, rgba(5, 5, 8, .8), rgba(5, 5, 8, .5) 55%, transparent);
}

.code {
  margin: 0;
  padding-left: .06em;
  font-size: clamp(5.25rem, min(30vw, 32vh), 12.5rem);
  font-weight: 800;
  line-height: 1;
  letter-spacing: .06em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  text-shadow:
    0 0 20px rgba(160, 140, 255, .65),
    0 0 64px rgba(110, 125, 255, .45),
    0 0 140px rgba(var(--cyan), .28);
  animation: emerge 1.8s cubic-bezier(.2, .7, .2, 1) backwards, glow 6s ease-in-out 1.8s infinite;
}

.msg { margin: 18px 0 0; font-size: clamp(1.05rem, 4.6vw, 1.3rem); font-weight: 500; letter-spacing: .02em; color: var(--ink-dim); }
.sub { margin: 6px 0 0; font: 500 clamp(.85rem, 3.6vw, 1rem)/1.4 var(--mono); color: var(--ink-faint); }
.path {
  max-width: min(86vw, 460px);
  margin: 10px 0 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font: 500 .78rem/1.4 var(--mono);
  color: rgba(200, 205, 240, .38);
}

.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  margin-top: 28px;
  padding: 0 1.6rem;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, .1);
  background: rgba(16, 16, 30, .5);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
  color: var(--ink-dim);
  font: 600 .95rem/1 var(--font);
  letter-spacing: .02em;
  text-decoration: none;
  touch-action: manipulation;
  transition: transform .25s ease, border-color .25s ease, background .25s ease, color .25s ease, box-shadow .25s ease;
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .pill { background: rgba(16, 16, 30, .88); }
}
@media (hover: hover) {
  .pill:hover {
    transform: translateY(-2px);
    border-color: rgba(var(--violet), .55);
    background: rgba(28, 26, 56, .62);
    color: #fff;
    box-shadow: 0 8px 30px -8px rgba(var(--violet), .6);
  }
}
.pill:active { transform: scale(.97); }
.pill:focus-visible { outline: 2px solid rgb(127, 220, 255); outline-offset: 3px; }

/* ===== MOTION ===== */
.msg, .sub, .path, .pill { animation: rise 1s cubic-bezier(.2, .7, .2, 1) 1.1s backwards; }
@keyframes emerge { from { opacity: 0; filter: blur(14px); transform: scale(1.06); } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
@keyframes glow { 50% { text-shadow: 0 0 26px rgba(160, 140, 255, .8), 0 0 80px rgba(110, 125, 255, .55), 0 0 170px rgba(var(--cyan), .36); } }
@media (prefers-reduced-motion: reduce) {
  .code, .msg, .sub, .path, .pill { animation: none; }
  .pill { transition: none; }
}
</style>
</head>

<body>
<canvas id="stream" aria-hidden="true"></canvas>

<main class="stage">
  <div class="content">
    <h1 class="code" aria-label="404"><span id="num" aria-hidden="true">404</span></h1>
    <p class="msg">Lost in deep space</p>
    <p class="sub">// Coordinate mismatch</p>
    <p class="path" id="path" hidden></p>
    <a class="pill" href="/">Return to Orbit</a>
  </div>
</main>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ===== SHOW THE MISSING ADDRESS ===== */
  try {
    var p = decodeURIComponent(location.pathname);
    if (p && p !== '/') {
      var pe = $('path');
      pe.textContent = 'Target: ' + p.slice(0, 80);
      pe.hidden = false;
    }
  } catch (e) {}

  /* ===== 404 DECODE-IN (digits resolve left to right) ===== */
  if (!reduce) {
    var num = $('num'), t0 = performance.now(), iv;
    num.textContent = '000';
    iv = setInterval(function () {
      var t = performance.now() - t0, out = '';
      for (var i = 0; i < 3; i++) out += t > 500 + i * 220 ? '404'.charAt(i) : (Math.random() * 10) | 0;
      num.textContent = out;
      if (t > 500 + 3 * 220) { clearInterval(iv); num.textContent = '404'; }
    }, 55);
  }

  /* ===== HEX STREAM ===== */
  var canvas = $('stream');
  var ctx = canvas.getContext('2d');
  var MONO = 'ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace';
  var HEX = '0123456789ABCDEF';

  // Three depth layers: far = small, dim, slow; near = larger, brighter, fast.
  var LAYERS = [
    { size: 12, cell: 14, glow: 3, alpha: .38, speed: [26, 55],   len: [8, 14],  density: .5 },
    { size: 16, cell: 19, glow: 4, alpha: .62, speed: [60, 110],  len: [8, 16],  density: .34 },
    { size: 22, cell: 26, glow: 6, alpha: .92, speed: [120, 210], len: [6, 12],  density: .2 }
  ];

  var W = 0, H = 0, dpr = 1, built = false, tags = [];

  function rand(a, b) { return a + Math.random() * (b - a); }

  // Pre-render all 16 glyphs once, with the glow baked in, so each frame is just drawImage calls.
  function atlas(size, glow, color) {
    var k = dpr, cw = Math.ceil(size * .62) + Math.ceil(glow * 3), ch = size + Math.ceil(glow * 3);
    var pw = Math.ceil(cw * k), ph = Math.ceil(ch * k);
    var c = document.createElement('canvas');
    c.width = pw * 16; c.height = ph;
    var g = c.getContext('2d');
    g.font = '600 ' + (size * k) + 'px ' + MONO;
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = color;
    g.shadowColor = 'rgba(165, 180, 255, .9)'; // soft periwinkle halo, glyphs stay white/silver
    g.shadowBlur = glow * k;
    for (var i = 0; i < 16; i++) g.fillText(HEX.charAt(i), i * pw + pw / 2, ph / 2 + k * .5);
    return { c: c, pw: pw, ph: ph, w: pw / k, h: ph / k };
  }

  function buildAtlas(L) {
    L.body = atlas(L.size, L.glow, '#dbe1f0');   // pale silver trail
    L.head = atlas(L.size, L.glow * 2.2, '#ffffff'); // bright white leading digit
  }

  function respawn(s, L, initial) {
    s.x = ((Math.random() * L.cols) | 0) * L.cell + L.cell / 2;
    s.v = rand(L.speed[0], L.speed[1]);
    s.n = Math.round(rand(L.len[0], L.len[1]));
    s.a = .45 + Math.random() * .55; // each stream gets its own opacity
    s.y = initial ? rand(-s.n * L.cell, H + L.cell) : -rand(0, H * .4);
    s.c = new Uint8Array(s.n);
    for (var i = 0; i < s.n; i++) s.c[i] = (Math.random() * 16) | 0;
  }

  function buildStreams(L) {
    L.cols = Math.max(1, Math.floor(W / L.cell));
    var n = Math.round(L.cols * L.density * (W < 600 ? .85 : 1));
    L.streams = [];
    for (var i = 0; i < n; i++) { var s = {}; respawn(s, L, true); L.streams.push(s); }
  }

  function n4() { var v = (Math.random() * 1999 - 999) | 0; return (v < 0 ? '-' : '+') + ('000' + Math.abs(v)).slice(-4); }
  function coord() { return 'X' + n4() + ' Y' + n4() + ' Z' + ('00' + ((Math.random() * 999) | 0)).slice(-3); }

  function rollTag(t, initial) {
    t.txt = coord();
    t.x = initial ? rand(-40, W) : -150;
    t.y = initial ? rand(20, H) : H + 20;
    t.vx = rand(5, 14);
    t.vy = -rand(4, 11);
    t.a = rand(.16, .38);
  }
  function buildTags() {
    tags = [];
    var n = Math.max(4, Math.min(14, Math.round(W / 130)));
    for (var i = 0; i < n; i++) { var t = {}; rollTag(t, true); tags.push(t); }
  }

  function size() {
    var d = Math.min(window.devicePixelRatio || 1, 2); // cap for smooth mobile performance
    var nw = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(nw * d);
    canvas.height = Math.round(H * d);
    if (d !== dpr || !built) { dpr = d; LAYERS.forEach(buildAtlas); }
    ctx.setTransform(d, 0, 0, d, 0, 0);
    if (nw !== W || !built) { W = nw; LAYERS.forEach(buildStreams); buildTags(); }
    built = true;
    if (reduce) draw();
  }

  function step(dt) {
    LAYERS.forEach(function (L) {
      for (var i = 0; i < L.streams.length; i++) {
        var s = L.streams[i];
        s.y += s.v * dt;
        if (Math.random() < .12) s.c[(Math.random() * s.n) | 0] = (Math.random() * 16) | 0; // digits flicker
        if (s.y - s.n * L.cell > H + L.cell) respawn(s, L, false);
      }
    });
    tags.forEach(function (t) {
      t.x += t.vx * dt; t.y += t.vy * dt;
      if (t.x > W + 10 || t.y < -20) rollTag(t, false);
    });
  }

  function glyph(a, i, x, y) {
    ctx.drawImage(a.c, i * a.pw, 0, a.pw, a.ph, x - a.w / 2, y - a.h / 2, a.w, a.h);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var l = 0; l < LAYERS.length; l++) {
      var L = LAYERS[l];
      for (var j = 0; j < L.streams.length; j++) {
        var s = L.streams[j];
        for (var i = 0; i < s.n; i++) {
          var gy = s.y - i * L.cell;
          if (gy < -L.cell || gy > H + L.cell) continue;
          var f = 1 - i / s.n;
          ctx.globalAlpha = L.alpha * s.a * (i === 0 ? 1 : f * f * .85);
          glyph(i === 0 ? L.head : L.body, s.c[i], s.x, gy);
        }
      }
    }
    ctx.font = '11px ' + MONO;
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#dfe4f0';
    for (var k = 0; k < tags.length; k++) {
      ctx.globalAlpha = tags[k].a;
      ctx.fillText(tags[k].txt, tags[k].x, tags[k].y);
    }
    ctx.globalAlpha = 1;
  }

  var last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min((now - last) / 1000, .05);
    last = now;
    step(dt);
    draw();
  }

  window.addEventListener('resize', size);
  window.addEventListener('orientationchange', size);
  size();
  if (!reduce) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
