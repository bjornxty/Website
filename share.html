<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bjorn — drop</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(18, 20, 29, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --input-bg: rgba(255, 255, 255, 0.04);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.08) 0px, transparent 50%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.7);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-pill {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #eab308;
    }

    .status-pill.connected {
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.2);
      background: rgba(16, 185, 129, 0.08);
    }

    .status-pill.connected .status-dot {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .key-card {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .key-info span {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .key-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #a5b4fc;
    }

    .key-actions {
      display: flex;
      gap: 6px;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-icon:hover { background: rgba(255, 255, 255, 0.12); }

    .qr-modal {
      display: none;
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      margin: 0 auto 20px auto;
      width: max-content;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
    }

    input[type="text"] {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      box-shadow: 0 0 16px var(--accent-glow);
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--input-bg);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .tab {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .tab.active {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .dropzone {
      border: 2px dashed rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
      background: rgba(255, 255, 255, 0.01);
    }

    .dropzone:hover {
      border-color: var(--accent);
      background: rgba(99, 102, 241, 0.04);
    }

    .dropzone svg {
      width: 32px;
      height: 32px;
      stroke: var(--text-muted);
      margin-bottom: 10px;
      transition: 0.2s;
    }

    .dropzone:hover svg {
      stroke: var(--accent);
    }

    .dropzone p {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }

    .dropzone span {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
      display: block;
    }

    textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 13px;
      outline: none;
      resize: none;
      height: 85px;
      margin-bottom: 12px;
      transition: 0.2s;
    }

    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .feed {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .feed-item {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .feed-item a {
      color: #a5b4fc;
      text-decoration: none;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.15);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
    }

    .feed-item a:hover {
      background: rgba(99, 102, 241, 0.3);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="brand">bjorn // drop</div>
    <div class="status-pill" id="status-pill">
      <div class="status-dot"></div>
      <span id="status-text">Ready</span>
    </div>
  </div>

  <div class="key-card">
    <div class="key-info">
      <span>Device Key</span>
      <div class="key-val" id="my-id">------</div>
    </div>
    <div class="key-actions">
      <button class="btn-icon" onclick="copyKey()" title="Copy Key">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
      </button>
      <button class="btn-icon" onclick="toggleQR()" title="Scan QR">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
      </button>
    </div>
  </div>

  <div id="qrcode" class="qr-modal"></div>

  <div class="input-group">
    <input type="text" id="target-id" placeholder="Paste remote key...">
    <button class="btn-primary" onclick="connectToPeer()">Connect</button>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('file')">Files & APKs</button>
    <button class="tab" onclick="switchTab('text')">Text Clip</button>
  </div>

  <div id="tab-file" class="tab-content active">
    <div class="dropzone" onclick="document.getElementById('file-input').click()">
      <input type="file" id="file-input" style="display:none" onchange="sendFile(this.files[0])">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5"><path d="M12 16.5V3m0 0l-4 4m4-4l4 4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"></path></svg>
      <p>Select File or APK</p>
      <span>P2P direct transfer • Unlimited size</span>
    </div>
  </div>

  <div id="tab-text" class="tab-content">
    <textarea id="text-msg" placeholder="Paste raw text, link, or note to beam across..."></textarea>
    <button class="btn-primary" style="width: 100%; height: 40px;" onclick="sendText()">Send Text</button>
  </div>

  <div class="feed" id="feed"></div>
</div>

<script>
  const peer = new Peer(Math.random().toString(36).substring(2, 8).toUpperCase());
  let conn = null;

  peer.on('open', id => {
    document.getElementById('my-id').innerText = id;
    new QRCode(document.getElementById("qrcode"), {
      text: `${window.location.origin}/share?connect=${id}`,
      width: 120,
      height: 120
    });

    const params = new URLSearchParams(window.location.search);
    const target = params.get('connect');
    if (target) {
      document.getElementById('target-id').value = target;
      connectToPeer();
    }
  });

  peer.on('connection', c => {
    conn = c;
    bindEvents();
  });

  function connectToPeer() {
    const target = document.getElementById('target-id').value.trim().toUpperCase();
    if (!target) return;
    conn = peer.connect(target);
    bindEvents();
  }

  function bindEvents() {
    conn.on('open', () => {
      const pill = document.getElementById('status-pill');
      pill.classList.add('connected');
      document.getElementById('status-text').innerText = 'Connected';
    });

    conn.on('data', data => {
      if (data.type === 'file') {
