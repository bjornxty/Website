<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>File drop · Bjorn</title>
<meta name="description" content="Send files and text straight from one device to another.">
<meta name="theme-color" content="#050508">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23050508'/><circle cx='16' cy='16' r='5' fill='%23b9c2ff'/><circle cx='16' cy='16' r='10' fill='%237c5cff' fill-opacity='.25'/></svg>">

<style>
/* ===== DESIGN TOKENS (same as index.html) ===== */
:root {
  --void: #050508;
  --ink: #f4f6ff;
  --ink-dim: #d9ddf5;
  --ink-faint: rgba(200, 205, 240, .52);
  --violet: 124, 92, 255;
  --cyan: 76, 201, 240;
  --mint: 94, 242, 176;
  --amber: 255, 196, 107;
  --rose: 255, 107, 139;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--void); -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--font);
  color: var(--ink);
  background: var(--void);
  overflow-x: hidden;
}
body::before { /* faint nebula tint, fixed behind everything */
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(60% 50% at 18% 88%, rgba(var(--cyan), .055), transparent 70%),
    radial-gradient(55% 45% at 86% 14%, rgba(var(--violet), .08), transparent 70%);
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

.wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 40px);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.stack { display: flex; flex-direction: column; gap: 14px; }

/* ===== GLASS ===== */
.glass {
  background: rgba(16, 16, 30, .5);
  border: 1px solid rgba(255, 255, 255, .09);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  backdrop-filter: blur(14px) saturate(140%);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: rgba(16, 16, 30, .88); }
}

/* ===== TOP BAR + STATUS ===== */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.back, .status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  border-radius: 999px;
  font-size: .88rem;
  font-weight: 500;
  color: var(--ink-dim);
}
.back { padding: 0 16px 0 10px; text-decoration: none; transition: transform .25s, border-color .25s, color .25s; }
.back svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.status { --c: 138, 143, 176; padding: 0 14px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: rgb(var(--c)); box-shadow: 0 0 10px rgba(var(--c), .9); }
body[data-state="ready"] .status { --c: var(--cyan); }
body[data-state="connecting"] .status { --c: var(--amber); }
body[data-state="connected"] .status { --c: var(--mint); }
body[data-state="offline"] .status { --c: var(--rose); }
body[data-state="connecting"] .dot { animation: pulse 1s ease-in-out infinite; }

/* ===== HERO ===== */
.hero { text-align: center; padding: 14px 0 6px; }
h1 {
  margin: 0;
  padding-left: .12em;
  font-size: clamp(2.4rem, 11vw, 3.4rem);
  font-weight: 300;
  line-height: 1.1;
  letter-spacing: .12em;
  text-shadow: 0 0 18px rgba(150, 130, 255, .55), 0 0 60px rgba(100, 120, 255, .35), 0 0 120px rgba(var(--cyan), .2);
  animation: emerge 2s cubic-bezier(.2, .7, .2, 1) backwards;
}
.hero p { margin: 12px auto 0; max-width: 30ch; color: var(--ink-faint); font-size: .95rem; line-height: 1.5; }
.stack, .foot { animation: rise 1s cubic-bezier(.2, .7, .2, 1) .5s backwards; }

/* ===== CARDS ===== */
.card { padding: 18px; border-radius: 22px; }
.label { display: block; margin: 0 0 10px; font-size: .85rem; font-weight: 500; color: var(--ink-faint); }
.head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.head .label { margin: 0; }
.row { display: flex; gap: 10px; }

.key {
  margin-bottom: 12px;
  padding: 16px 8px;
  border-radius: 16px;
  border: 1px solid rgba(var(--violet), .3);
  background: rgba(5, 5, 12, .55);
  font: 600 clamp(1.3rem, 6.4vw, 1.8rem)/1.2 var(--mono);
  letter-spacing: .04em;
  text-align: center;
  word-break: break-all;
  color: var(--ink);
  text-shadow: 0 0 14px rgba(150, 130, 255, .6), 0 0 40px rgba(var(--cyan), .25);
  -webkit-user-select: all;
  user-select: all;
  transition: opacity .4s;
}
.key.dim { opacity: .35; text-shadow: none; }

/* ===== BUTTONS + INPUTS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 0 18px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, .1);
  background: rgba(255, 255, 255, .05);
  color: var(--ink-dim);
  font: 600 .95rem/1 var(--font);
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .2s ease, border-color .25s ease, background .25s ease, color .25s ease, box-shadow .25s ease, filter .25s ease;
}
.btn svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.btn.grow { flex: 1; }
.btn.primary {
  border: 0;
  color: #050508;
  background: linear-gradient(135deg, rgb(var(--violet)), rgb(var(--cyan)));
  box-shadow: 0 8px 28px -10px rgba(var(--violet), .85);
}
.btn.mini { min-height: 34px; padding: 0 12px; font-size: .8rem; border-radius: 10px; }
.btn.ok { border-color: rgba(var(--mint), .6); color: rgb(var(--mint)); }
.btn:active { transform: scale(.96); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }
.btn:focus-visible, .dz:focus-visible { outline: 2px solid rgb(127, 220, 255); outline-offset: 3px; }
@media (hover: hover) {
  .btn:not(:disabled):hover { transform: translateY(-2px); border-color: rgba(var(--violet), .55); color: #fff; }
  .btn.primary:not(:disabled):hover { color: #050508; filter: brightness(1.1); box-shadow: 0 12px 34px -10px rgba(var(--violet), 1); }
  .back:hover { transform: translateY(-2px); border-color: rgba(var(--violet), .5); color: #fff; }
}

.input {
  flex: 1;
  min-width: 0;
  min-height: 52px;
  padding: 0 14px;
  border-radius: 14px;
  border: 1px solid rgba(255, 255, 255, .1);
  background: rgba(5, 5, 12, .6);
  color: var(--ink);
  font: 500 1rem/1 var(--mono); /* 16px stops mobile browsers zooming on focus */
  transition: border-color .25s, box-shadow .25s;
}
.input::placeholder { color: rgba(200, 205, 240, .3); }
.input:focus { outline: none; border-color: rgba(var(--cyan), .6); box-shadow: 0 0 0 3px rgba(var(--cyan), .14); }
.input:disabled { opacity: .6; }
textarea.input { display: block; width: 100%; min-height: 96px; padding: 12px 14px; font-family: var(--font); line-height: 1.45; resize: vertical; }

/* ===== DROPZONE ===== */
.dz {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 100%;
  padding: 30px 16px;
  border-radius: 22px;
  border: 1.5px dashed rgba(var(--violet), .5);
  background: rgba(var(--violet), .06);
  color: var(--ink-dim);
  font: inherit;
  text-align: center;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease, opacity .25s ease;
}
.dz svg { width: 32px; height: 32px; margin-bottom: 4px; fill: none; stroke: rgb(var(--cyan)); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform .3s ease; }
.dz b { font-size: 1rem; font-weight: 600; }
.dz small { color: var(--ink-faint); font-size: .82rem; }
.dz:active { transform: scale(.98); }
.dz.over { border-color: rgb(var(--cyan)); background: rgba(var(--cyan), .09); transform: scale(1.01); box-shadow: 0 0 40px -10px rgba(var(--cyan), .55); }
.dz.over svg { transform: translateY(-5px); }
.dz.locked { opacity: .55; border-color: rgba(255, 255, 255, .18); background: transparent; }
.dz.locked svg { stroke: var(--ink-faint); }

/* ===== FEED ===== */
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px;
  border-radius: 16px;
  background: rgba(255, 255, 255, .035);
  border: 1px solid rgba(255, 255, 255, .06);
  animation: pop .35s cubic-bezier(.2, .7, .2, 1);
}
.item.out { --b: var(--violet); }
.item.in { --b: var(--cyan); }
.badge { flex: none; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; background: rgba(var(--b), .15); color: rgb(var(--b)); }
.badge svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.body { flex: 1; min-width: 0; align-self: center; }
.t { font-size: .95rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t.txt { max-height: 9.5em; overflow: auto; white-space: pre-wrap; word-break: break-word; font-weight: 500; line-height: 1.45; }
.t a { color: rgb(var(--cyan)); text-underline-offset: 2px; }
.m { margin-top: 3px; font-size: .78rem; color: var(--ink-faint); }
.bar { height: 4px; margin-top: 8px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.bar i { display: block; width: 0; height: 100%; border-radius: 4px; background: linear-gradient(90deg, rgb(var(--violet)), rgb(var(--cyan))); transition: width .15s linear; }
.act { flex: none; align-self: center; }
.act .btn { min-height: 40px; padding: 0 14px; font-size: .85rem; border-radius: 12px; }
.item.fail .m { color: rgb(var(--rose)); }
.empty { padding: 22px 8px; text-align: center; color: var(--ink-faint); font-size: .9rem; line-height: 1.5; }
.foot { margin: 4px auto 0; max-width: 34ch; text-align: center; color: var(--ink-faint); font-size: .8rem; line-height: 1.5; }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  z-index: 5;
  max-width: calc(100% - 32px);
  padding: 12px 18px;
  border-radius: 999px;
  font-size: .9rem;
  font-weight: 500;
  text-align: center;
  opacity: 0;
  transform: translate(-50%, 16px);
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ===== MOTION ===== */
@keyframes emerge { from { opacity: 0; filter: blur(14px); transform: scale(1.06); } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) {
  h1, .stack, .foot, .item, body[data-state="connecting"] .dot { animation: none; }
  .btn, .dz, .back, .toast, .bar i { transition: none; }
}
@media (max-width: 380px) { .card { padding: 14px; } .btn { padding: 0 14px; } }
</style>
</head>

<body data-state="starting">
<canvas id="bg" aria-hidden="true"></canvas>

<div class="wrap">
  <header class="top">
    <a class="back glass" href="/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      Bjorn
    </a>
    <div class="status glass" role="status" aria-live="polite">
      <i class="dot"></i><span id="status-text">Starting</span>
    </div>
  </header>

  <section class="hero">
    <h1>File drop</h1>
    <p>Send files and text straight from one device to another.</p>
  </section>

  <main class="stack">
    <!-- YOUR KEY -->
    <section class="card glass">
      <span class="label">Your key</span>
      <div class="key dim" id="key">········</div>
      <div class="row">
        <button class="btn primary grow" id="copy" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5.5 15A1.5 1.5 0 0 1 4 13.5v-8A1.5 1.5 0 0 1 5.5 4h8A1.5 1.5 0 0 1 15 5.5"/></svg>
          <span class="lb">Copy key</span>
        </button>
        <button class="btn grow" id="link" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
          <span class="lb">Copy link</span>
        </button>
      </div>
    </section>

    <!-- CONNECT -->
    <section class="card glass">
      <label class="label" for="remote">Connect to a device</label>
      <form class="row" id="cform" autocomplete="off">
        <input class="input" id="remote" placeholder="Paste their key" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="text" enterkeyhint="go">
        <button class="btn primary" id="go" type="submit" disabled>Connect</button>
      </form>
    </section>

    <!-- FILES -->
    <button class="dz locked" id="dz" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L8 8m4-4 4 4M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
      <b id="dz-title">Connect to a device to send files</b>
      <small>Any file, any size. APKs and videos included.</small>
    </button>
    <input type="file" id="file" multiple hidden>

    <!-- TEXT -->
    <section class="card glass">
      <label class="label" for="text">Send text or a link</label>
      <textarea class="input" id="text" rows="3" maxlength="50000" placeholder="Type or paste something"></textarea>
      <div class="row" style="margin-top:10px">
        <button class="btn" id="paste" type="button">Paste</button>
        <button class="btn primary grow" id="send" type="button" disabled>Send text</button>
      </div>
    </section>

    <!-- TRANSFERS -->
    <section class="card glass">
      <div class="head">
        <span class="label">Transfers</span>
        <button class="btn mini" id="clear" type="button">Clear</button>
      </div>
      <ul class="feed" id="feed">
        <li class="empty" id="empty">Nothing here yet. Connect to a device, then send a file or some text.</li>
      </ul>
    </section>
  </main>

  <p class="foot">Keep this tab open and your screen on while a transfer is running.</p>
</div>

<div class="toast glass" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="position:relative;z-index:2;text-align:center;color:#d9ddf5">JavaScript is required for file drop.</p></noscript>

<script>
(function () {
  'use strict';

  /* ===== SETTINGS ===== */
  var CHUNK = 65536;            // bytes per data-channel message
  var READ = 1048576;           // bytes read from disk at a time
  var HIGH = 4 * 1048576;       // pause sending when this much is queued
  var MERGE = 32 * 1048576;     // receiver folds chunks into Blobs this often (keeps memory low)
  var ALPHA = 'abcdefghjkmnpqrstuvwxyz23456789'; // no look-alikes (0/o, 1/l/i)
  var KEY_LENGTH = 10;          // random letters and numbers only
  // PeerJS is loaded from your own site first (add peerjs.min.js to the repo root),
  // then from a pinned jsDelivr copy as a fallback.
  var SOURCES = ['/peerjs.min.js', 'https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js'];

  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var el = {
    key: $('key'), copy: $('copy'), link: $('link'), form: $('cform'), remote: $('remote'), go: $('go'),
    dz: $('dz'), dzTitle: $('dz-title'), file: $('file'), text: $('text'), paste: $('paste'),
    send: $('send'), feed: $('feed'), clear: $('clear'), status: $('status-text'), toast: $('toast')
  };

  var peer = null, conn = null, myKey = '', state = 'starting';
  var rx = null, queue = Promise.resolve(), active = 0, urls = [];
  var reconnectT = null, connectT = null, pendingAuto = '', wake = null;

  /* ===== HELPERS ===== */
  var store = {
    get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function clock() { return new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  function fmt(n) {
    if (n < 1024) return n + ' B';
    var u = ['KB', 'MB', 'GB', 'TB'], i = -1;
    do { n /= 1024; i++; } while (n >= 1024 && i < 3);
    return n.toFixed(n < 10 ? 1 : 0) + ' ' + u[i];
  }
  function ok() { return !!(conn && conn.open); }

  var toastT;
  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastT);
    toastT = setTimeout(function () { el.toast.classList.remove('show'); }, 2400);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise(function (resolve, reject) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      var done = false;
      try { done = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      done ? resolve() : reject();
    });
  }

  function flash(btn, label) {
    var lb = btn.querySelector('.lb') || btn;
    if (!btn.dataset.l) btn.dataset.l = lb.textContent;
    lb.textContent = label;
    btn.classList.add('ok');
    clearTimeout(btn._t);
    btn._t = setTimeout(function () { lb.textContent = btn.dataset.l; btn.classList.remove('ok'); }, 1400);
  }

  /* ===== SCREEN WAKE LOCK (keeps transfers alive on phones) ===== */
  function lock() {
    try {
      if ('wakeLock' in navigator && !wake && document.visibilityState === 'visible') {
        navigator.wakeLock.request('screen').then(function (w) {
          wake = w; w.addEventListener('release', function () { wake = null; });
        }, function () {});
      }
    } catch (e) {}
  }
  function unlock() { if (wake) { wake.release().catch(function () {}); wake = null; } }
  document.addEventListener('visibilitychange', function () { if (state === 'connected') lock(); });

  /* ===== STATUS / UI STATE ===== */
  var LABELS = { starting: 'Starting', ready: 'Ready', connecting: 'Connecting', connected: 'Connected', offline: 'Offline' };

  function updateSend() { el.send.disabled = state !== 'connected' || !el.text.value.trim(); }

  function setState(s, label) {
    state = s;
    document.body.dataset.state = s;
    el.status.textContent = label || LABELS[s];
    var on = s === 'connected';
    el.remote.disabled = on || s === 'connecting';
    el.go.textContent = on ? 'Disconnect' : s === 'connecting' ? 'Cancel' : 'Connect';
    el.go.disabled = s === 'starting' || s === 'offline';
    el.dz.classList.toggle('locked', !on);
    el.dzTitle.textContent = on ? 'Drop files here or tap to choose' : 'Connect to a device to send files';
    updateSend();
    if (on) lock(); else unlock();
  }

  /* ===== PEER ===== */
  function loadPeer(i) {
    return new Promise(function (resolve, reject) {
      if (window.Peer) return resolve();
      if (i >= SOURCES.length) return reject();
      var s = document.createElement('script');
      s.src = SOURCES[i];
      s.onload = function () { window.Peer ? resolve() : loadPeer(i + 1).then(resolve, reject); };
      s.onerror = function () { s.remove(); loadPeer(i + 1).then(resolve, reject); };
      document.head.appendChild(s);
    });
  }

  function newKey() {
    var r = new Uint8Array(KEY_LENGTH);
    crypto.getRandomValues(r);
    return Array.prototype.map.call(r, function (x) { return ALPHA[x % ALPHA.length]; }).join('');
  }

  // A saved key is only reused if it matches the current format exactly.
  // Anything older (such as the "bjn-" prefixed keys) is discarded and replaced.
  var KEY_FORMAT = new RegExp('^[' + ALPHA + ']{' + KEY_LENGTH + '}$');
  function savedKey() {
    var k = store.get('bjn-key');
    if (k && KEY_FORMAT.test(k)) return k;
    if (k) store.del('bjn-key');
    return '';
  }

  function start(fresh) {
    if (peer) { try { peer.destroy(); } catch (e) {} }
    peer = null; conn = null;
    setState('starting');
    el.key.classList.add('dim');
    el.copy.disabled = el.link.disabled = true;

    var key = (!fresh && savedKey()) || newKey();
    store.set('bjn-key', key);
    var p = peer = new Peer(key);
    function on(ev, fn) { p.on(ev, function (a) { if (p === peer) fn(a); }); }

    on('open', function (id) {
      myKey = id;
      el.key.textContent = id;
      el.key.classList.remove('dim');
      el.copy.disabled = el.link.disabled = false;
      clearTimeout(reconnectT);
      if (!conn) setState('ready');
      if (pendingAuto) { var k = pendingAuto; pendingAuto = ''; connectTo(k); }
    });

    on('connection', function (c) {
      attach(c);
      setState('connecting');
      el.remote.value = c.peer;
    });

    on('disconnected', function () {
      if (!conn) setState('offline');
      scheduleReconnect();
    });

    on('error', function (e) {
      var t = e && e.type;
      if (t === 'unavailable-id') { store.del('bjn-key'); start(true); return; }
      if (t === 'peer-unavailable') { toast('No device online with that key'); dropConn(true); return; }
      if (t === 'browser-incompatible') { setState('offline', 'Not supported'); return; }
      if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') {
        if (!conn) setState('offline');
        scheduleReconnect();
        return;
      }
      toast('Something went wrong (' + (t || 'unknown') + ')');
    });
  }

  function scheduleReconnect() {
    clearTimeout(reconnectT);
    reconnectT = setTimeout(function () {
      if (!peer) return;
      if (peer.destroyed) start(false);
      else if (peer.disconnected) peer.reconnect();
      if (peer && !peer.open) scheduleReconnect();
    }, 3000);
  }
  window.addEventListener('online', function () { if (peer && !peer.open) scheduleReconnect(); });

  function connectTo(raw) {
    var key = String(raw || '').trim();
    if (key.indexOf('#') > -1) key = key.split('#').pop();
    key = key.replace(/\s+/g, '');
    if (!key) { toast('Enter the other device’s key'); el.remote.focus(); return; }
    if (key === myKey) { toast('That’s your own key'); return; }
    if (!peer || !peer.open) { toast('Still starting, try again in a moment'); return; }
    el.remote.value = key;
    var c = peer.connect(key, { reliable: true, serialization: 'raw' });
    attach(c);
    setState('connecting');
    clearTimeout(connectT);
    connectT = setTimeout(function () {
      if (conn === c && !c.open) { toast('Couldn’t reach that device'); dropConn(true); }
    }, 20000);
  }

  function attach(c) {
    if (conn && conn !== c) { var old = conn; conn = null; try { old.close(); } catch (e) {} }
    conn = c;
    c.on('open', function () {
      if (conn !== c) return;
      clearTimeout(connectT);
      el.remote.value = c.peer;
      setState('connected');
      toast('Connected');
    });
    c.on('data', function (d) { if (conn === c) onData(d); });
    function gone() {
      if (conn !== c) return;
      var was = state === 'connected';
      conn = null;
      clearTimeout(connectT);
      failRx('Connection lost');
      setState(peer && peer.open ? 'ready' : 'offline');
      if (was) toast('Disconnected');
    }
    c.on('close', gone);
    c.on('error', gone);
  }

  function dropConn(quiet) {
    var c = conn, was = state === 'connected';
    conn = null;
    clearTimeout(connectT);
    failRx('Disconnected');
    if (c) { try { c.close(); } catch (e) {} }
    setState(peer && peer.open ? 'ready' : 'offline');
    if (was && !quiet) toast('Disconnected');
  }

  /* ===== FEED ===== */
  var ICON = {
    out: '<svg viewBox="0 0 24 24"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>',
    "in": '<svg viewBox="0 0 24 24"><path d="M12 5v14m0 0 6-6m-6 6-6-6"/></svg>'
  };

  function addItem(dir, title) {
    var empty = $('empty');
    if (empty) empty.remove();
    var li = document.createElement('li');
    li.className = 'item ' + dir;
    li.innerHTML = '<span class="badge">' + ICON[dir] + '</span><div class="body"><div class="t"></div><div class="m"></div><div class="bar"><i></i></div></div><div class="act"></div>';
    var q = function (s) { return li.querySelector(s); };
    var it = { li: li, t: q('.t'), m: q('.m'), bar: q('.bar'), fill: q('.bar i'), act: q('.act') };
    it.t.textContent = title;
    el.feed.prepend(li);
    return it;
  }
  function prog(it, f, txt) {
    it.fill.style.width = (Math.min(1, f) * 100).toFixed(1) + '%';
    if (txt) it.m.textContent = txt;
  }
  function fail(it, msg) { it.li.classList.add('fail'); it.bar.hidden = true; it.m.textContent = msg; }

  function linkify(node, text) {
    text.split(/(https?:\/\/[^\s<>"']+)/g).forEach(function (part, i) {
      if (i % 2) {
        var a = document.createElement('a');
        a.href = part; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = part;
        node.appendChild(a);
      } else if (part) node.appendChild(document.createTextNode(part));
    });
  }

  function addText(dir, text) {
    var it = addItem(dir, '');
    it.bar.hidden = true;
    it.t.classList.add('txt');
    linkify(it.t, text);
    it.m.textContent = (dir === 'out' ? 'Sent' : 'Received') + ' · ' + clock();
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'btn'; b.textContent = 'Copy';
    b.onclick = function () {
      copyText(text).then(function () { flash(b, 'Copied'); }, function () { toast('Couldn’t copy'); });
    };
    it.act.appendChild(b);
  }

  /* ===== RECEIVE ===== */
  function onData(d) {
    if (typeof d === 'string') {
      var m; try { m = JSON.parse(d); } catch (e) { return; }
      if (m.t === 'text' && typeof m.text === 'string') addText('in', m.text);
      else if (m.t === 'file') startRx(m);
      else if (m.t === 'end') endRx(m);
      return;
    }
    if (rx && d && d.byteLength !== undefined) chunkRx(d);
  }

  function startRx(m) {
    failRx('Interrupted');
    var name = String(m.name || 'file').replace(/[\\\/:*?"<>|\u0000-\u001f]/g, '_').slice(0, 200) || 'file';
    var size = Number(m.size) || 0;
    var it = addItem('in', name);
    rx = { id: m.id, name: name, size: size, type: String(m.type || 'application/octet-stream'),
           got: 0, buf: [], bufSize: 0, parts: [], it: it, last: 0 };
    prog(it, 0, 'Receiving · 0 B / ' + fmt(size));
    active++;
  }

  function chunkRx(d) {
    rx.buf.push(d); rx.bufSize += d.byteLength; rx.got += d.byteLength;
    if (rx.bufSize >= MERGE) { rx.parts.push(new Blob(rx.buf)); rx.buf = []; rx.bufSize = 0; }
    var now = performance.now();
    if (now - rx.last > 120) {
      rx.last = now;
      prog(rx.it, rx.size ? rx.got / rx.size : 0, 'Receiving · ' + fmt(rx.got) + ' / ' + fmt(rx.size));
    }
  }

  function endRx(m) {
    if (!rx || rx.id !== m.id) return;
    var r = rx; rx = null; active--;
    var blob = new Blob(r.parts.concat(r.buf), { type: r.type });
    if (r.size && blob.size !== r.size) { fail(r.it, 'Incomplete transfer'); return; }
    var url = URL.createObjectURL(blob);
    urls.push(url);
    r.it.bar.hidden = true;
    r.it.m.textContent = 'Received · ' + fmt(blob.size) + ' · ' + clock();
    var a = document.createElement('a');
    a.className = 'btn primary'; a.href = url; a.download = r.name; a.textContent = 'Save';
    r.it.act.appendChild(a);
  }

  function failRx(msg) {
    if (!rx) return;
    var r = rx; rx = null; active--;
    fail(r.it, msg);
  }

  /* ===== SEND ===== */
  function sendFiles(list) {
    var files = Array.prototype.slice.call(list);
    if (!files.length) return;
    if (!ok()) { toast('Connect to a device first'); return; }
    files.forEach(function (f) { queue = queue.then(function () { return sendFile(f); }); });
  }

  async function sendFile(f) {
    var it = addItem('out', f.name || 'file');
    active++;
    try {
      if (!ok()) throw new Error('Not connected');
      var c = conn, dc = c.dataChannel, id = Math.random().toString(36).slice(2);
      c.send(JSON.stringify({ t: 'file', id: id, name: f.name, size: f.size, type: f.type }));
      var off = 0, last = 0;
      while (off < f.size) {
        var buf = await f.slice(off, Math.min(off + READ, f.size)).arrayBuffer();
        for (var p = 0; p < buf.byteLength; p += CHUNK) {
          while (dc.bufferedAmount > HIGH) {
            if (!c.open) throw new Error('Connection lost');
            await sleep(8);
          }
          if (!c.open) throw new Error('Connection lost');
          var len = Math.min(CHUNK, buf.byteLength - p);
          c.send(new Uint8Array(buf, p, len));
          var now = performance.now();
          if (now - last > 120) {
            last = now;
            prog(it, (off + p + len) / f.size, 'Sending · ' + fmt(off + p + len) + ' / ' + fmt(f.size));
          }
        }
        off += buf.byteLength;
      }
      c.send(JSON.stringify({ t: 'end', id: id }));
      while (dc.bufferedAmount > 0 && c.open) await sleep(30);
      if (!c.open) throw new Error('Connection lost');
      it.bar.hidden = true;
      it.m.textContent = 'Sent · ' + fmt(f.size) + ' · ' + clock();
    } catch (e) {
      fail(it, (e && e.message) || 'Send failed');
    } finally {
      active--;
    }
  }

  /* ===== EVENTS ===== */
  el.form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (state === 'connected' || state === 'connecting') dropConn();
    else connectTo(el.remote.value);
  });

  el.copy.addEventListener('click', function () {
    copyText(myKey).then(function () { flash(el.copy, 'Copied'); },
      function () { toast('Couldn’t copy. Press and hold the key instead.'); });
  });
  el.link.addEventListener('click', function () {
    copyText(location.origin + location.pathname + '#' + myKey).then(function () { flash(el.link, 'Copied'); },
      function () { toast('Couldn’t copy the link'); });
  });

  el.dz.addEventListener('click', function () {
    if (!ok()) { toast('Connect to a device first'); return; }
    el.file.click();
  });
  el.file.addEventListener('change', function () { sendFiles(el.file.files); el.file.value = ''; });

  function hasFiles(e) { return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') > -1; }
  ['dragenter', 'dragover'].forEach(function (ev) {
    window.addEventListener(ev, function (e) { e.preventDefault(); if (hasFiles(e)) el.dz.classList.add('over'); });
  });
  window.addEventListener('dragleave', function (e) { if (!e.relatedTarget) el.dz.classList.remove('over'); });
  window.addEventListener('drop', function (e) {
    e.preventDefault();
    el.dz.classList.remove('over');
    if (e.dataTransfer && e.dataTransfer.files.length) sendFiles(e.dataTransfer.files);
  });

  el.text.addEventListener('input', updateSend);
  el.text.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) el.send.click(); });
  el.send.addEventListener('click', function () {
    var v = el.text.value;
    if (!v.trim() || !ok()) return;
    try {
      conn.send(JSON.stringify({ t: 'text', text: v }));
      addText('out', v);
      el.text.value = '';
      updateSend();
    } catch (e) { toast('Couldn’t send that'); }
  });
  el.paste.addEventListener('click', function () {
    try {
      navigator.clipboard.readText().then(function (t) {
        el.text.value = t.slice(0, 50000); updateSend(); el.text.focus();
      }, function () { toast('Allow clipboard access, or paste manually'); });
    } catch (e) { toast('Paste manually in the box'); }
  });

  el.clear.addEventListener('click', function () {
    urls.forEach(function (u) { URL.revokeObjectURL(u); });
    urls = [];
    el.feed.innerHTML = '<li class="empty" id="empty">Nothing here yet. Connect to a device, then send a file or some text.</li>';
  });

  window.addEventListener('beforeunload', function (e) { if (active > 0) { e.preventDefault(); e.returnValue = ''; } });
  window.addEventListener('pagehide', function () { try { if (peer) peer.destroy(); } catch (e) {} });

  /* ===== BOOT ===== */
  setState('starting');
  loadPeer(0).then(function () {
    var h = location.hash.slice(1);
    if (h) { pendingAuto = h; el.remote.value = h; }
    start(false);
  }, function () {
    setState('offline', 'Library blocked');
    toast('Couldn’t load PeerJS. Add peerjs.min.js to your site.');
  });

  /* ===== STARFIELD BACKDROP (light, non-interactive) ===== */
  (function () {
    var c = $('bg'), x = c.getContext('2d'), W = 0, H = 0, stars = [], last = 0;
    function size() {
      var d = Math.min(window.devicePixelRatio || 1, 1.5);
      W = window.innerWidth; H = window.innerHeight;
      c.width = W * d; c.height = H * d;
      x.setTransform(d, 0, 0, d, 0, 0);
      var n = Math.min(520, Math.round(W * H / 2800));
      stars = [];
      for (var i = 0; i < n; i++) stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: .4 + Math.pow(Math.random(), 3) * 1.4, a: .3 + Math.random() * .6,
        s: .5 + Math.random() * 1.5, p: Math.random() * 6.28, v: 2 + Math.random() * 6
      });
      draw(0, 0);
    }
    function draw(t, dt) {
      x.clearRect(0, 0, W, H);
      x.fillStyle = '#dfe4ff';
      for (var i = 0; i < stars.length; i++) {
        var s = stars[i];
        x.globalAlpha = s.a * (reduce ? 1 : .7 + .3 * Math.sin(t / 1000 * s.s + s.p));
        x.fillRect(s.x, s.y, s.r * 2, s.r * 2);
        if (!reduce) { s.y -= s.v * dt; if (s.y < -2) { s.y = H + 2; s.x = Math.random() * W; } }
      }
    }
    function loop(t) {
      requestAnimationFrame(loop);
      if (t - last < 33) return; // ~30fps keeps it gentle on battery and leaves CPU for transfers
      var dt = Math.min((t - last) / 1000, .1);
      last = t;
      draw(t, dt);
    }
    window.addEventListener('resize', function () {
      if (window.innerWidth !== W || Math.abs(window.innerHeight - H) > 150) size();
    });
    size();
    if (!reduce) requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
