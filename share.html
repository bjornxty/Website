<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bjorn — drop</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: #090a0f;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #12141d;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }
    .status {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      color: #94a3b8;
    }
    .status.online {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
    }
    .key-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .key-label {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }
    .key-code {
      font-family: monospace;
      font-size: 18px;
      font-weight: 700;
      color: #818cf8;
      letter-spacing: 1.5px;
    }
    .copy-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .connect-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    input[type="text"] {
      flex: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #6366f1;
    }
    .btn-connect {
      background: #6366f1;
      border: none;
      color: #fff;
      border-radius: 10px;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .dropzone {
      border: 2px dashed rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 16px;
      background: rgba(255, 255, 255, 0.01);
    }
    .dropzone:hover {
      border-color: #6366f1;
      background: rgba(99, 102, 241, 0.05);
    }
    .dropzone p {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
    }
    .dropzone span {
      font-size: 11px;
      color: #64748b;
      margin-top: 4px;
      display: block;
    }
    textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 10px 14px;
      color: #fff;
      font-size: 13px;
      outline: none;
      resize: none;
      height: 60px;
      margin-bottom: 8px;
    }
    .btn-send {
      width: 100%;
      background: #27272a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #fff;
      border-radius: 10px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-send:hover {
      background: #3f3f46;
    }
    .feed {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 12px;
    }
    .feed-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 10px 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      word-break: break-all;
    }
    .feed-item a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
      margin-left: 10px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header">
    <div class="title">bjorn // drop</div>
    <div class="status" id="status-badge">Ready</div>
  </div>

  <div class="key-box">
    <div>
      <div class="key-label">Your Key</div>
      <div class="key-code" id="my-id">...</div>
    </div>
    <button class="copy-btn" onclick="copyKey()">Copy</button>
  </div>

  <div class="connect-row">
    <input type="text" id="target-id" placeholder="Remote key...">
    <button class="btn-connect" onclick="connectToPeer()">Connect</button>
  </div>

  <div class="dropzone" onclick="document.getElementById('file-input').click()">
    <input type="file" id="file-input" style="display:none" onchange="sendFile(this.files[0])">
    <p>Drop or Select File / APK</p>
    <span>Direct P2P • No limits</span>
  </div>

  <textarea id="text-msg" placeholder="Paste link or text to send..."></textarea>
  <button class="btn-send" onclick="sendText()">Send Text</button>

  <div class="feed" id="feed"></div>
</div>

<script>
  let myKey = Math.random().toString(36).substring(2, 8).toUpperCase();
  const peer = new Peer(myKey);
  let conn = null;

  peer.on('open', id => {
    document.getElementById('my-id').innerText = id;
  });

  peer.on('connection', c => {
    conn = c;
    setupEvents();
  });

  function connectToPeer() {
    const target = document.getElementById('target-id').value.trim().toUpperCase();
    if (!target) return;
    conn = peer.connect(target);
    setupEvents();
  }

  function setupEvents() {
    conn.on('open', () => {
      const badge = document.getElementById('status-badge');
      badge.classList.add('online');
      badge.innerText = 'Connected';
    });

    conn.on('data', data => {
      if (data.type === 'file') {
        const blob = new Blob([data.file], { type: data.filetype });
        const url = URL.createObjectURL(blob);
        addFeed(`<span>${escapeHtml(data.filename)}</span> <a href="${url}" download="${escapeHtml(data.filename)}">Download</a>`);
      } else if (data.type === 'text') {
        addFeed(`<span>${escapeHtml(data.text)}</span>`);
      }
    });

    conn.on('close', () => {
      const badge = document.getElementById('status-badge');
      badge.classList.remove('online');
      badge.innerText = 'Disconnected';
    });
  }

  function sendFile(file) {
    if (!conn || !conn.open) return alert('Connect to a device first.');
    if (!file) return;
    conn.send({ type: 'file', file: file, filename: file.name, filetype: file.type });
    addFeed(`<span>Sent: ${escapeHtml(file.name)}</span>`);
  }

  function sendText() {
    if (!conn || !conn.open) return alert('Connect to a device first.');
    const el = document.getElementById('text-msg');
    const txt = el.value.trim();
    if (!txt) return;
    conn.send({ type: 'text', text: txt });
    addFeed(`<span>Sent: ${escapeHtml(txt)}</span>`);
    el.value = '';
  }

  function addFeed(html) {
    const feed = document.getElementById('feed');
    const row = document.createElement('div');
    row.className = 'feed-item';
    row.innerHTML = html;
    feed.prepend(row);
  }

  function copyKey() {
    const key = document.getElementById('my-id').innerText;
    if (key && key !== '...') {
      navigator.clipboard.writeText(key);
      alert('Key copied: ' + key);
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
</script>

</body>
</html>
